<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECT HUB — 10-Site Ecosystem Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">

<style>
  :root {
    --bg-canvas: #090C10;
    --bg-stage: #0D1218;
    --neon-green: #22FF88;
    --neon-green-dim: rgba(34, 255, 136, 0.16);
    --text-white: #FFFFFF;
    --text-dim: #9AA6B2;
    --border-subtle: rgba(255, 255, 255, 0.12);
    --grad-title: linear-gradient(90deg, #5CE1E6 0%, #A855F7 52%, #FF6B6B 100%);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    background: var(--bg-canvas);
    color: var(--text-white);
    font-family: 'Hind Siliguri', 'Space Grotesk', system-ui, sans-serif;
  }

  .nft-hero {
    position: relative;
    width: 100%;
    max-width: 1280px;
    margin: 8px auto 12px;
    border-radius: 24px;
    background:
      radial-gradient(circle at 50% 18%, rgba(168, 85, 247, 0.14) 0%, transparent 45%),
      radial-gradient(circle at 50% 68%, rgba(34, 255, 136, 0.12) 0%, transparent 55%),
      linear-gradient(180deg, #0B0F14 0%, #0E141C 62%, #080B0F 100%);
    border: 1px solid var(--border-subtle);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    padding: 14px 18px 20px;
  }

  .nft-hero-inner {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 100%;
  }

  .nft-nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    width: 100%;
    min-width: 0;
    padding-bottom: 8px;
  }

  .nft-brand,
  .nft-links {
    display: none !important;
  }

  .nft-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    max-width: 100%;
  }

  .nft-search-box {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 3px 8px 3px 10px;
    height: 32px;
    transition: border-color 0.28s cubic-bezier(0.22, 1, 0.36, 1), background 0.28s ease, box-shadow 0.28s ease;
  }

  .nft-search-box:focus-within {
    border-color: var(--neon-green);
    background: rgba(15, 23, 32, 0.96);
    box-shadow: 0 0 14px rgba(34, 255, 136, 0.18);
  }

  .nft-search-btn {
    background: transparent;
    border: none;
    color: var(--neon-green);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }

  .nft-search-input {
    width: 112px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-white);
    font-family: inherit;
    font-size: 12.5px;
    padding-left: 6px;
  }

  .nft-search-input::placeholder {
    color: var(--text-dim);
  }

  .nft-add-btn {
    height: 32px;
    padding: 0 13px;
    border-radius: 999px;
    border: none;
    background: var(--neon-green);
    color: #06130B;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 0 14px rgba(34, 255, 136, 0.35);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
  }

  .nft-add-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 20px rgba(34, 255, 136, 0.55);
  }

  .nft-head {
    text-align: center;
    max-width: 680px;
    margin: 6px auto 12px;
  }

  .nft-title {
    font-family: 'Space Grotesk', 'Hind Siliguri', sans-serif;
    font-size: clamp(22px, 3.6vw, 38px);
    font-weight: 700;
    line-height: 1.14;
    letter-spacing: -0.015em;
    text-transform: uppercase;
  }

  .nft-title .grad-word {
    background: var(--grad-title);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .nft-subtitle {
    margin-top: 5px;
    font-size: clamp(12.5px, 1.5vw, 14px);
    color: var(--text-dim);
    line-height: 1.45;
  }

  .nft-stage-wrap {
    position: relative;
    width: 100%;
    padding: 12px 8px 14px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.01) 0%, rgba(16,26,38,0.55) 55%, rgba(10,16,24,0.92) 100%);
    overflow: hidden;
  }

  .nft-stage-wrap::after {
    content: "";
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: 0;
    height: 76px;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 36px 18px;
    transform: perspective(360px) rotateX(48deg);
    transform-origin: bottom center;
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }

  /* শেক বা জার্টি বাউন্স বন্ধ করতে scroll-behavior: auto এবং snap-type: none রাখা হয়েছে */
  .nft-cards-row {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    width: 100%;
    min-height: 226px;
    overflow-x: auto;
    overflow-y: visible;
    padding: 6px 14px 10px;
    scroll-behavior: auto;
    scroll-snap-type: none;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(34, 255, 136, 0.35) transparent;
  }

  .nft-cards-row::-webkit-scrollbar {
    height: 5px;
  }

  .nft-cards-row::-webkit-scrollbar-thumb {
    background: rgba(34, 255, 136, 0.35);
    border-radius: 999px;
  }

  /* শেকিং অ্যানিমেশন সম্পূর্ণ বাদ দেওয়া হয়েছে */
  .poster-card {
    position: relative;
    width: 134px;
    height: 186px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.55);
    cursor: pointer;
    flex: 0 0 auto;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      box-shadow 0.2s ease,
      border-color 0.2s ease,
      opacity 0.2s ease,
      filter 0.2s ease;
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px;
    transform: none;
    animation: none;
  }

  .poster-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(6,10,16,0.25) 0%, rgba(6,10,16,0.12) 45%, rgba(6,10,16,0.88) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .poster-card > * {
    position: relative;
    z-index: 2;
  }

  .poster-card:hover {
    border-color: rgba(255, 255, 255, 0.65);
    z-index: 6;
  }

  /* ফোকাস বা সক্রিয় কার্ডে কোনো সাইজ/ট্রান্সফর্ম জাম্প বা শেক না করে স্থিতিশীল গ্লো ও বর্ডার রাখা হয়েছে */
  .poster-card.is-center {
    border: 2px solid var(--neon-green);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.7), 0 0 18px rgba(34, 255, 136, 0.25);
    z-index: 8;
  }

  .poster-card.is-hidden-search {
    opacity: 0.22;
    filter: grayscale(0.75);
  }

  .poster-card.is-double-tapped {
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.8), 0 0 24px rgba(34, 255, 136, 0.55);
  }

  .poster-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  .poster-chip {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.16);
    white-space: nowrap;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .poster-card.is-center .poster-chip {
    background: var(--neon-green);
    color: #06130B;
    border-color: var(--neon-green);
  }

  .poster-bottom {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .poster-title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.2;
    color: #FFFFFF;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .poster-card.is-center .poster-title {
    font-size: 13.5px;
  }

  .poster-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .poster-domain {
    font-size: 10.5px;
    color: #D8E2EC;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 95px;
  }

  .poster-open-btn {
    background: rgba(34, 255, 136, 0.92);
    color: #06130B;
    border: none;
    border-radius: 999px;
    padding: 3px 8px;
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease;
  }

  .poster-open-btn:hover {
    background: #FFFFFF;
  }

  .smooth-nav-toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 0);
    background: rgba(13, 20, 28, 0.94);
    border: 1px solid rgba(34, 255, 136, 0.55);
    color: #FFFFFF;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 20px rgba(34, 255, 136, 0.22);
    z-index: 9998;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    white-space: nowrap;
  }

  .smooth-nav-toast.is-visible {
    opacity: 1;
  }

  .smooth-nav-toast[hidden] {
    display: none !important;
  }

  .eco-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 13, 0.8);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 9999;
  }

  .eco-modal-backdrop[hidden] {
    display: none !important;
  }

  .eco-modal {
    width: 100%;
    max-width: 460px;
    background: #111822;
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
  }

  .eco-modal h2 {
    font-size: 19px;
    margin-bottom: 4px;
  }

  .eco-modal p {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .eco-field {
    margin-bottom: 11px;
  }

  .eco-field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #DCE6F0;
  }

  .eco-field input[type="text"],
  .eco-field select {
    width: 100%;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: #0A0F16;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
  }

  .eco-field input[type="text"]:focus,
  .eco-field select:focus {
    border-color: var(--neon-green);
  }

  .photo-upload-box {
    border: 1px dashed rgba(34, 255, 136, 0.45);
    background: #0A0F16;
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .photo-upload-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .photo-file-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 9px;
    background: rgba(34, 255, 136, 0.14);
    border: 1px solid rgba(34, 255, 136, 0.45);
    color: var(--neon-green);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .photo-file-input {
    display: none;
  }

  .photo-clear-btn {
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.08);
    color: #E2E8F0;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .photo-preview-wrap {
    width: 100%;
    height: 92px;
    border-radius: 10px;
    background: #070B10 center/cover no-repeat;
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-dim);
  }

  .same-photo-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 12.5px;
    color: #E2E8F0;
    cursor: pointer;
    user-select: none;
  }

  .same-photo-check input {
    accent-color: var(--neon-green);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .eco-modal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .eco-btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .eco-btn-green {
    background: var(--neon-green);
    color: #06130B;
  }

  .eco-btn-dark {
    background: rgba(255, 255, 255, 0.1);
    color: #FFFFFF;
  }

  @media (min-width: 1024px) {
    .nft-cards-row {
      justify-content: flex-start;
    }
  }

  @media (max-width: 900px) {
    .poster-card {
      width: 124px;
      height: 172px;
    }
    .poster-card.is-center {
      width: 124px;
      height: 172px;
    }
    .nft-search-input {
      width: 88px;
    }
  }

  @media (max-width: 600px) {
    .nft-hero {
      margin: 4px auto 8px;
      padding: 10px 12px 14px;
      border-radius: 18px;
    }
    .nft-search-input {
      width: 76px;
    }
  }
</style>
</head>
<body>

<header class="nft-hero" id="project-ecosystem-hero" aria-label="প্রজেক্ট ইকোসিস্টেম হিরো">
  <div class="nft-hero-inner">
    <nav class="nft-nav" aria-label="প্রজেক্ট অ্যাকশন বার">
      <div class="nft-actions">
        <div class="nft-search-box">
          <button type="button" class="nft-search-btn" id="nft-search-trigger" title="প্রজেক্ট খুঁজুন" aria-label="প্রজেক্ট খুঁজুন">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
            </svg>
          </button>
          <input type="search" class="nft-search-input" id="nft-search-input" placeholder="খুঁজুন..." aria-label="প্রজেক্ট সার্চ">
        </div>

        <button type="button" class="nft-add-btn" id="nft-open-add">
          <span>+ যোগ করুন</span>
        </button>
      </div>
    </nav>

    <div class="nft-head">
      <h1 class="nft-title" id="hero-main-title">
        ALL TEN SITES IN <span class="grad-word">ONE HUB</span>
      </h1>
      <p class="nft-subtitle" id="hero-sub-desc">
        সিঙ্গেল টাচ বা স্লাইডে কার্ড ফোকাস হবে; ডবল টাচ করলে স্মুথলি পরের লিংকে প্রবেশ করবে।
      </p>
    </div>

    <div class="nft-stage-wrap">
      <div class="nft-cards-row" id="nft-posters-stage" role="list" aria-label="১০টি প্রজেক্ট পোস্টার"></div>
    </div>
  </div>
</header>

<div class="smooth-nav-toast" id="smooth-nav-toast" hidden></div>

<!-- Add / Edit Project Modal -->
<div class="eco-modal-backdrop" id="eco-modal" hidden>
  <div class="eco-modal" role="dialog" aria-modal="true" aria-labelledby="eco-modal-title">
    <h2 id="eco-modal-title">প্রজেক্ট যোগ বা এডিট করুন</h2>
    <p id="eco-modal-sub">ফটো আপলোড করুন এবং প্রয়োজনে সব লিংকে একই ফটো সেভ করুন।</p>
    <form id="eco-form">
      <div class="eco-field">
        <label for="eco-slot-select">কোন স্লট এডিট বা সেট করবেন?</label>
        <select id="eco-slot-select"></select>
      </div>
      <div class="eco-field">
        <label for="eco-name">ওয়েবসাইটের নাম</label>
        <input type="text" id="eco-name" placeholder="যেমন: Zoni Skin Care" required>
      </div>
      <div class="eco-field">
        <label for="eco-url">ওয়েবসাইট লিংক (URL)</label>
        <input type="text" id="eco-url" placeholder="https://example.com" required>
      </div>
      <div class="eco-field">
        <label>পোস্টার ফটো আপলোড (লিংক নয়)</label>
        <div class="photo-upload-box">
          <div class="photo-upload-top">
            <label for="eco-photo-file" class="photo-file-label">
              <span>+ ফটো আপলোড করুন</span>
            </label>
            <input type="file" id="eco-photo-file" class="photo-file-input" accept="image/*">
            <button type="button" class="photo-clear-btn" id="eco-photo-clear">ফটো মুছুন</button>
          </div>
          <div class="photo-preview-wrap" id="eco-photo-preview">কোনো ফটো আপলোড করা হয়নি</div>
          <label class="same-photo-check" for="eco-apply-all-links">
            <input type="checkbox" id="eco-apply-all-links">
            <span>সব লিংকে একই ফটো সেভ করুন (Save all links as same photo)</span>
          </label>
        </div>
      </div>
      <div class="eco-field">
        <label for="eco-theme">পোস্টার থিম স্টাইল</label>
        <select id="eco-theme">
          <option value="holo">হলোগ্রাফিক সায়ান-পিঙ্ক</option>
          <option value="cyber">নিয়ন ব্লু ও ডার্ক গ্রো</option>
          <option value="crimson">ক্রিমসন ও ভায়োলেট</option>
          <option value="gold">গোল্ডেন অ্যাম্বার ও ডার্ক</option>
          <option value="pink">পিঙ্ক ও ম্যাজেন্টা গ্লো</option>
          <option value="emerald">এমারেল্ড মিন্ট ও ডার্ক</option>
          <option value="indigo">ইন্ডিগো ও ডার্ক নেবুলা</option>
          <option value="teal">টিল ও ডার্ক ওশান</option>
        </select>
      </div>
      <div class="eco-modal-foot">
        <button type="button" class="eco-btn eco-btn-dark" id="eco-reset-defaults">ডিফল্ট রিসেট</button>
        <div style="display:flex;gap:8px;">
          <button type="button" class="eco-btn eco-btn-dark" id="eco-cancel-modal">বাতিল</button>
          <button type="submit" class="eco-btn eco-btn-green">সেভ করুন</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "project.hub.10sites.v10.no_shake";

  var THEMES = {
    holo: "radial-gradient(circle at 30% 20%, rgba(92, 225, 230, 0.72), transparent 55%), radial-gradient(circle at 75% 30%, rgba(244, 114, 182, 0.68), transparent 55%), radial-gradient(circle at 50% 85%, rgba(129, 140, 248, 0.72), transparent 60%), linear-gradient(160deg, #1E293B 0%, #0F172A 100%)",
    cyber: "radial-gradient(circle at 50% 25%, rgba(56, 189, 248, 0.55), transparent 60%), linear-gradient(165deg, #0C4A6E 0%, #082F49 55%, #090D16 100%)",
    crimson: "radial-gradient(circle at 50% 25%, rgba(244, 63, 94, 0.5), transparent 60%), linear-gradient(165deg, #4C0519 0%, #2E1065 60%, #090D16 100%)",
    gold: "radial-gradient(circle at 50% 25%, rgba(251, 191, 36, 0.48), transparent 60%), linear-gradient(165deg, #451A03 0%, #291508 60%, #090D16 100%)",
    pink: "radial-gradient(circle at 50% 25%, rgba(236, 72, 153, 0.55), transparent 60%), linear-gradient(165deg, #500724 0%, #3B0764 60%, #090D16 100%)",
    emerald: "radial-gradient(circle at 50% 25%, rgba(34, 255, 136, 0.42), transparent 60%), linear-gradient(165deg, #064E3B 0%, #022C22 60%, #090D16 100%)",
    indigo: "radial-gradient(circle at 50% 25%, rgba(129, 140, 248, 0.5), transparent 60%), linear-gradient(165deg, #1E1B4B 0%, #0F172A 60%, #090D16 100%)",
    teal: "radial-gradient(circle at 50% 25%, rgba(45, 212, 191, 0.48), transparent 60%), linear-gradient(165deg, #134E4A 0%, #042F2E 60%, #090D16 100%)"
  };

  var DEFAULT_SITES = [
    { name: "KIDS LEARNING", url: "https://amarboi.netlify.app/", photo: "", theme: "cyber" },
    { name: "ZONI SKIN CARE", url: "https://zoniskincare.vercel.app/", photo: "", theme: "pink" },
    { name: "DOVASHI LIVE", url: "https://dovashi.vercel.app/", photo: "", theme: "emerald" },
    { name: "HILL ECO TOURISM", url: "https://hillecotourism.vercel.app/", photo: "", theme: "teal" },
    { name: "MODERN VERANDAH", url: "https://modernverandah.vercel.app/", photo: "", theme: "gold" },
    { name: "VENTILATED SHED", url: "https://ventilatedshed.vercel.app/", photo: "", theme: "indigo" },
    { name: "GUANGZHOU SOURCING", url: "https://gzsourcing.vercel.app/", photo: "", theme: "crimson" },
    { name: "AIR TICKETING GDS", url: "https://airgds.vercel.app/", photo: "", theme: "holo" },
    { name: "IELTS VOCAB HUB", url: "https://ieltsvocab.vercel.app/", photo: "", theme: "cyber" },
    { name: "PROPERTY BD", url: "https://propertybd.vercel.app/", photo: "", theme: "emerald" }
  ];

  var stageEl = document.getElementById("nft-posters-stage");
  var searchInput = document.getElementById("nft-search-input");
  var searchTrigger = document.getElementById("nft-search-trigger");
  var openAddBtn = document.getElementById("nft-open-add");
  var modalBackdrop = document.getElementById("eco-modal");
  var modalForm = document.getElementById("eco-form");
  var slotSelect = document.getElementById("eco-slot-select");
  var nameInput = document.getElementById("eco-name");
  var urlInput = document.getElementById("eco-url");
  var themeSelect = document.getElementById("eco-theme");
  var fileInput = document.getElementById("eco-photo-file");
  var clearPhotoBtn = document.getElementById("eco-photo-clear");
  var photoPreview = document.getElementById("eco-photo-preview");
  var applyAllLinksCheck = document.getElementById("eco-apply-all-links");
  var cancelModalBtn = document.getElementById("eco-cancel-modal");
  var resetDefaultsBtn = document.getElementById("eco-reset-defaults");
  var toastEl = document.getElementById("smooth-nav-toast");

  var sites = [];
  var activeIndex = 0;
  var draftPhotoDataUrl = "";
  var toastTimer = null;
  var scrollSyncTimer = null;
  var isProgrammaticScroll = false;

  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.hidden = false;
    requestAnimationFrame(function () {
      toastEl.classList.add("is-visible");
    });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("is-visible");
      setTimeout(function () {
        toastEl.hidden = true;
      }, 220);
    }, 1800);
  }

  function cloneDefaults() {
    return DEFAULT_SITES.map(function (item) {
      return {
        name: item.name,
        url: item.url,
        photo: item.photo || "",
        theme: item.theme || "holo"
      };
    });
  }

  function loadSites() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length >= 1) {
          sites = parsed.map(function (item, idx) {
            var fb = DEFAULT_SITES[idx % DEFAULT_SITES.length];
            return {
              name: (item && item.name) ? String(item.name) : fb.name,
              url: (item && item.url) ? String(item.url) : fb.url,
              photo: (item && typeof item.photo === "string") ? item.photo : "",
              theme: (item && item.theme && THEMES[item.theme]) ? item.theme : fb.theme
            };
          });
          return;
        }
      }
    } catch (e) {}
    sites = cloneDefaults();
  }

  function saveSites() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
    } catch (e) {
      showToast("স্টোরেজ সীমা পূর্ণ, তবে সেশনে কার্ড আপডেট হয়েছে।");
    }
  }

  function getDomainLabel(rawUrl) {
    try {
      var u = new URL(rawUrl.indexOf("http") === 0 ? rawUrl : "https://" + rawUrl);
      return u.hostname.replace(/^www\./, "");
    } catch (e) {
      return rawUrl;
    }
  }

  function normalizeUrl(rawUrl) {
    var trimmed = (rawUrl || "").trim();
    if (!trimmed) return "https://example.com";
    if (!/^https?:\/\//i.test(trimmed)) {
      return "https://" + trimmed;
    }
    return trimmed;
  }

  function applyCardBackground(cardEl, site) {
    var themeBg = THEMES[site.theme] || THEMES.holo;
    if (site.photo) {
      cardEl.style.backgroundImage = 'url("' + site.photo + '"), ' + themeBg;
    } else {
      cardEl.style.backgroundImage = themeBg;
    }
  }

  function updatePhotoPreview(dataUrl) {
    if (dataUrl) {
      photoPreview.style.backgroundImage = 'url("' + dataUrl + '")';
      photoPreview.textContent = "";
    } else {
      photoPreview.style.backgroundImage = "none";
      photoPreview.textContent = "কোনো ফটো আপলোড করা হয়নি";
    }
  }

  function populateSlotSelect(selectedIdx) {
    slotSelect.innerHTML = "";
    sites.forEach(function (site, idx) {
      var opt = document.createElement("option");
      opt.value = String(idx);
      opt.textContent = "স্লট #" + (idx + 1) + " — " + site.name;
      if (idx === selectedIdx) opt.selected = true;
      slotSelect.appendChild(opt);
    });
    var newOpt = document.createElement("option");
    newOpt.value = "new";
    newOpt.textContent = "+ নতুন কার্ড যোগ করুন (স্লট #" + (sites.length + 1) + ")";
    if (selectedIdx === "new") newOpt.selected = true;
    slotSelect.appendChild(newOpt);
  }

  function navigateToSite(index, cardEl) {
    var targetSite = sites[index];
    if (!targetSite) return;
    var finalUrl = normalizeUrl(targetSite.url);
    if (cardEl) {
      cardEl.classList.add("is-double-tapped");
      setTimeout(function () {
        cardEl.classList.remove("is-double-tapped");
      }, 180);
    }
    showToast(targetSite.name + " ওপেন হচ্ছে...");
    setTimeout(function () {
      window.open(finalUrl, "_blank", "noopener,noreferrer");
    }, 120);
  }

  function setActiveCard(index, shouldScrollIntoView) {
    if (!sites.length) return;
    activeIndex = ((index % sites.length) + sites.length) % sites.length;
    var cards = stageEl.querySelectorAll(".poster-card");
    cards.forEach(function (card, idx) {
      if (idx === activeIndex) {
        card.classList.add("is-center");
      } else {
        card.classList.remove("is-center");
      }
    });

    if (shouldScrollIntoView && cards[activeIndex]) {
      var targetCard = cards[activeIndex];
      var rowRect = stageEl.getBoundingClientRect();
      var cardRect = targetCard.getBoundingClientRect();
      var currentLeft = stageEl.scrollLeft;
      var delta = (cardRect.left - rowRect.left) - (rowRect.width - cardRect.width) / 2;
      isProgrammaticScroll = true;
      stageEl.scrollLeft = Math.max(0, currentLeft + delta);
      clearTimeout(scrollSyncTimer);
      scrollSyncTimer = setTimeout(function () {
        isProgrammaticScroll = false;
      }, 80);
    }
  }

  function syncFocusOnSlide() {
    if (isProgrammaticScroll) return;
    var cards = Array.prototype.slice.call(stageEl.querySelectorAll(".poster-card"));
    if (!cards.length) return;
    var rowRect = stageEl.getBoundingClientRect();
    var rowCenter = rowRect.left + rowRect.width / 2;
    var bestIdx = activeIndex;
    var bestDist = Infinity;

    cards.forEach(function (card, idx) {
      var r = card.getBoundingClientRect();
      var c = r.left + r.width / 2;
      var dist = Math.abs(c - rowCenter);
      if (dist < bestDist) {
        bestDist = dist;
        bestIdx = idx;
      }
    });

    if (bestIdx !== activeIndex) {
      setActiveCard(bestIdx, false);
    }
  }

  function renderCards() {
    var q = (searchInput.value || "").trim().toLowerCase();
    stageEl.innerHTML = "";

    if (activeIndex >= sites.length) {
      activeIndex = Math.max(0, sites.length - 1);
    }

    sites.forEach(function (site, idx) {
      var card = document.createElement("div");
      card.className = "poster-card" + (idx === activeIndex ? " is-center" : "");
      card.setAttribute("role", "listitem");
      card.dataset.index = String(idx);
      applyCardBackground(card, site);

      var matches = !q ||
        site.name.toLowerCase().indexOf(q) !== -1 ||
        site.url.toLowerCase().indexOf(q) !== -1 ||
        getDomainLabel(site.url).toLowerCase().indexOf(q) !== -1;

      if (!matches) {
        card.classList.add("is-hidden-search");
      }

      var topRow = document.createElement("div");
      topRow.className = "poster-top";

      var chip = document.createElement("span");
      chip.className = "poster-chip";
      chip.textContent = "#" + (idx + 1);
      topRow.appendChild(chip);

      var bottomRow = document.createElement("div");
      bottomRow.className = "poster-bottom";

      var titleEl = document.createElement("div");
      titleEl.className = "poster-title";
      titleEl.textContent = site.name;

      var metaRow = document.createElement("div");
      metaRow.className = "poster-meta-row";

      var domainEl = document.createElement("span");
      domainEl.className = "poster-domain";
      domainEl.textContent = getDomainLabel(site.url);

      var openBtn = document.createElement("button");
      openBtn.type = "button";
      openBtn.className = "poster-open-btn";
      openBtn.textContent = "খুলুন";
      openBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        setActiveCard(idx, false);
        navigateToSite(idx, card);
      });

      metaRow.appendChild(domainEl);
      metaRow.appendChild(openBtn);
      bottomRow.appendChild(titleEl);
      bottomRow.appendChild(metaRow);

      card.appendChild(topRow);
      card.appendChild(bottomRow);

      // সিঙ্গেল টাচে ফোকাস (কোনো শেক বা স্ক্রল জাম্প ছাড়া), ডবল টাচে সরাসরি ওপেন
      var lastTapTime = 0;
      card.addEventListener("click", function () {
        var now = Date.now();
        var isDouble = (now - lastTapTime) < 340;
        lastTapTime = now;
        setActiveCard(idx, false);
        if (isDouble) {
          navigateToSite(idx, card);
        }
      });

      stageEl.appendChild(card);
    });
  }

  function fillModalFromSlot(slotVal) {
    if (slotVal === "new") {
      nameInput.value = "";
      urlInput.value = "";
      themeSelect.value = "holo";
      draftPhotoDataUrl = "";
      fileInput.value = "";
      applyAllLinksCheck.checked = false;
      updatePhotoPreview("");
      return;
    }
    var idx = parseInt(slotVal, 10);
    var site = sites[idx] || sites[0];
    if (!site) return;
    nameInput.value = site.name;
    urlInput.value = site.url;
    themeSelect.value = site.theme && THEMES[site.theme] ? site.theme : "holo";
    draftPhotoDataUrl = site.photo || "";
    fileInput.value = "";
    applyAllLinksCheck.checked = false;
    updatePhotoPreview(draftPhotoDataUrl);
  }

  function openModal(initialSlot) {
    var targetSlot = (initialSlot !== undefined) ? initialSlot : activeIndex;
    populateSlotSelect(targetSlot);
    fillModalFromSlot(String(targetSlot));
    modalBackdrop.hidden = false;
  }

  function closeModal() {
    modalBackdrop.hidden = true;
  }

  openAddBtn.addEventListener("click", function () {
    openModal("new");
  });

  cancelModalBtn.addEventListener("click", closeModal);

  modalBackdrop.addEventListener("click", function (ev) {
    if (ev.target === modalBackdrop) {
      closeModal();
    }
  });

  slotSelect.addEventListener("change", function () {
    fillModalFromSlot(slotSelect.value);
  });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (!file.type || file.type.indexOf("image/") !== 0) {
      showToast("অনুগ্রহ করে একটি বৈধ ছবি ফাইল নির্বাচন করুন।");
      return;
    }
    var reader = new FileReader();
    reader.onload = function (e) {
      draftPhotoDataUrl = (e.target && e.target.result) ? String(e.target.result) : "";
      updatePhotoPreview(draftPhotoDataUrl);
    };
    reader.readAsDataURL(file);
  });

  clearPhotoBtn.addEventListener("click", function () {
    draftPhotoDataUrl = "";
    fileInput.value = "";
    updatePhotoPreview("");
  });

  resetDefaultsBtn.addEventListener("click", function () {
    sites = cloneDefaults();
    activeIndex = 0;
    saveSites();
    renderCards();
    populateSlotSelect(0);
    fillModalFromSlot("0");
    showToast("১০টি ডিফল্ট কার্ড রিসেট করা হয়েছে।");
  });

  modalForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var slotVal = slotSelect.value;
    var nameVal = (nameInput.value || "").trim();
    var urlVal = normalizeUrl(urlInput.value);
    var themeVal = THEMES[themeSelect.value] ? themeSelect.value : "holo";

    if (!nameVal) return;

    var targetIdx = 0;
    if (slotVal === "new") {
      sites.push({
        name: nameVal,
        url: urlVal,
        photo: draftPhotoDataUrl || "",
        theme: themeVal
      });
      targetIdx = sites.length - 1;
    } else {
      targetIdx = parseInt(slotVal, 10);
      if (isNaN(targetIdx) || targetIdx < 0 || targetIdx >= sites.length) {
        targetIdx = 0;
      }
      sites[targetIdx] = {
        name: nameVal,
        url: urlVal,
        photo: draftPhotoDataUrl || "",
        theme: themeVal
      };
    }

    if (applyAllLinksCheck.checked) {
      var sharedPhoto = draftPhotoDataUrl || "";
      sites.forEach(function (s) {
        s.photo = sharedPhoto;
      });
    }

    activeIndex = targetIdx;
    saveSites();
    renderCards();
    closeModal();
    showToast(nameVal + " সেভ হয়েছে।");
  });

  searchInput.addEventListener("input", renderCards);
  searchTrigger.addEventListener("click", function () {
    searchInput.focus();
  });

  // স্লাইড করার সময় ফোকাস সিঙ্ক (শেক বন্ধ করতে scrollIntoView / smooth scroll বাদ দেওয়া হয়েছে)
  stageEl.addEventListener("scroll", function () {
    if (isProgrammaticScroll) return;
    clearTimeout(scrollSyncTimer);
    scrollSyncTimer = setTimeout(syncFocusOnSlide, 60);
  }, { passive: true });

  loadSites();
  renderCards();
})();
</script>
</body>
</html>
